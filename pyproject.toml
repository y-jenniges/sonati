[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonati"
version = "0.1.0"
description = "SONATI: Spatio-temporal Ocean Neighbourhood Asymmetric Transformer for Imputation of sparse, tabular data with uncertainty"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yvonne Jenniges" },
    { name = "Boris Peter Koch" },
    { name = "Sebastian Maneth"}
]
keywords = [
    "imputation", "spatiotemporal", "oceanography",
    "transformer", "deep-learning", "missing-data",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "tqdm",
]

[project.urls]
"Source Code" = "https://github.com/y-jenniges/sonati"
"Bug Tracker"  = "https://github.com/y-jenniges/sonati/issues"

[tool.setuptools.packages.find]
include = ["sonati*"]
